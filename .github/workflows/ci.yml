name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit tests (store, sync engine, router, query, OT, markdown)
        run: npm test
      - name: build the packages (dist + .d.ts)
        run: npm run build
      - name: build the example
        run: npm run build:example
